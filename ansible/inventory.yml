---
# Raspberry Pi K3s Cluster Inventory
#
# Select an inventory file based on your cluster type:
#   ansible-playbook -i inventories/single-pi.yml playbooks/k3s-install.yml
#   ansible-playbook -i inventories/multinode.yml playbooks/k3s-install.yml
#
# See inventories/ directory for cluster definitions
# See group_vars/ directory for cluster-specific configurations

all:
  children:
    k3s_cluster:
      children:
        master:
          hosts: {}
        workers:
          hosts: {}
        additional_masters:
          hosts: {}
