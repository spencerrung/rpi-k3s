---
# K3s Cluster Configuration - CLUSTER-SPECIFIC DEFAULTS
#
# This file is included by all clusters and provides defaults.
# For cluster-specific settings, use:
#   - group_vars/single_pi/all.yml (Single-node RPi5 cluster)
#   - group_vars/multinode/all.yml (Multi-node production cluster)
#
# USAGE:
#   Single-node:  ansible-playbook -i inventories/single-pi.yml playbooks/k3s-install.yml
#   Multi-node:   ansible-playbook -i inventories/multinode.yml playbooks/k3s-install.yml

# ============================================================================
# Ansible Configuration
# ============================================================================
ansible_python_interpreter: auto

# ============================================================================
# Defaults (should be overridden in cluster-specific vars)
# ============================================================================
cluster_type: unset  # Set by cluster-specific group_vars
cluster_name: rpi-cluster
cluster_domain: cluster.local

k3s_version: v1.29.10+k3s1
k3s_install_url: https://get.k3s.io
k3s_master_ip: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"
k3s_registration_address: "{{ k3s_master_ip }}"
k3s_api_port: 6443
k3s_tls_sans: []

k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_cluster_dns: "10.43.0.10"
k3s_flannel_backend: vxlan

k3s_data_dir: "/var/lib/rancher/k3s"
k3s_token_file: /var/lib/rancher/k3s/server/token

required_packages:
  - curl
  - iptables
  - conntrack
  - iptables-persistent
  - fuse-overlayfs

required_modules:
  - br_netfilter
  - overlay
  - ip_tables
  - ip6_tables

sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

enable_cgroups: true
cmdline_extra: "cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory"
default_storage_class: local-path

install_kubectl_completion: true
install_k9s: false
install_helm: true
helm_version: v3.13.3

dns_servers: "8.8.8.8 8.8.4.4"
