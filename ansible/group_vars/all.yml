---
# K3s Cluster Configuration
# All shared variables for Kubernetes cluster setup

# ============================================================================
# K3s Version and Installation
# ============================================================================
k3s_version: v1.29.10+k3s1  # Latest stable v1.29 for Raspberry Pi
k3s_install_url: https://get.k3s.io

# ============================================================================
# Network Configuration
# ============================================================================
# Master node configuration
k3s_master_ip: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"
k3s_api_port: 6443

# Cluster networking
k3s_cluster_cidr: "10.42.0.0/16"  # Pod network CIDR
k3s_service_cidr: "10.43.0.0/16"  # Service network CIDR
k3s_cluster_dns: "10.43.0.10"     # CoreDNS service IP

# Flannel backend (vxlan recommended for most cases)
k3s_flannel_backend: vxlan

# ============================================================================
# K3s Data Directory (must be local storage, not NFS!)
# ============================================================================
# For netboot systems, use tmpfs or USB storage
k3s_data_dir: "/var/lib/rancher/k3s"

# ============================================================================
# K3s Master Configuration
# ============================================================================
k3s_master_args:
  - "--disable=traefik"              # Disable default Traefik (optional)
  - "--disable=servicelb"            # Disable ServiceLB if using MetalLB
  - "--write-kubeconfig-mode=644"    # Make kubeconfig readable
  - "--cluster-cidr={{ k3s_cluster_cidr }}"
  - "--service-cidr={{ k3s_service_cidr }}"
  - "--flannel-backend={{ k3s_flannel_backend }}"
  - "--node-taint CriticalAddonsOnly=true:NoExecute"  # Don't schedule pods on master
  - "--data-dir={{ k3s_data_dir }}"  # Specify data directory
  - "--snapshotter=fuse-overlayfs"   # Use fuse-overlayfs for NFS compatibility

# Master install command
k3s_master_install_cmd: >-
  curl -sfL {{ k3s_install_url }} |
  INSTALL_K3S_VERSION={{ k3s_version }}
  INSTALL_K3S_EXEC="server {{ k3s_master_args | join(' ') }}"
  sh -

# ============================================================================
# K3s Worker Configuration
# ============================================================================
k3s_worker_args:
  - "--node-label worker=true"
  - "--snapshotter=fuse-overlayfs"   # Use fuse-overlayfs for NFS compatibility

# Token file location on master
k3s_token_file: /var/lib/rancher/k3s/server/node-token

# Worker install command (token populated at runtime)
k3s_worker_install_cmd: >-
  curl -sfL {{ k3s_install_url }} |
  INSTALL_K3S_VERSION={{ k3s_version }}
  K3S_URL=https://{{ k3s_master_ip }}:{{ k3s_api_port }}
  K3S_TOKEN={{ k3s_token }}
  INSTALL_K3S_EXEC="agent {{ k3s_worker_args | join(' ') }}"
  sh -

# ============================================================================
# System Prerequisites
# ============================================================================
# Required system packages
required_packages:
  - curl
  - iptables
  - conntrack
  - iptables-persistent  # Provides iptables-save/restore tools
  - fuse-overlayfs       # Required for overlay filesystem on NFS

# Kernel modules
required_modules:
  - br_netfilter
  - overlay
  - ip_tables
  - ip6_tables

# Sysctl settings
sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

# Cgroups configuration (required for Raspberry Pi)
enable_cgroups: true
cmdline_extra: "cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory"

# ============================================================================
# Storage Configuration
# ============================================================================
# K3s includes local-path provisioner by default
default_storage_class: local-path

# ============================================================================
# Optional Features
# ============================================================================
# Install kubectl completion
install_kubectl_completion: true

# Install k9s for cluster management
install_k9s: false

# Install helm
install_helm: true
helm_version: v3.13.3

# ============================================================================
# Network Configuration for Static IPs
# ============================================================================
# DNS servers for static IP configuration (defaults to Google DNS if not set)
dns_servers: "8.8.8.8 8.8.4.4"

# ============================================================================
# Cluster Metadata
# ============================================================================
cluster_name: rpi-cluster
cluster_domain: cluster.local
