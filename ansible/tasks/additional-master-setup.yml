---
# K3s Additional Master Node Setup Tasks
# Joins additional master nodes to existing K3s cluster for HA

- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_installed
  tags: [additional_master, install]

- name: Check K3s version if installed
  command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  when: k3s_installed.stat.exists
  tags: [additional_master, install]

- name: Check if this node is already a server
  stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_server_service
  tags: [additional_master, install]

- name: Check if this node is already an agent
  stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_service
  tags: [additional_master, install]

- name: Check for existing K3s agent state
  stat:
    path: "{{ k3s_data_dir }}/agent"
  register: k3s_agent_data
  tags: [additional_master, install]

- name: Refuse to overwrite an existing K3s installation
  ansible.builtin.assert:
    that:
      - not k3s_server_service.stat.exists
      - not k3s_agent_service.stat.exists
      - not k3s_agent_data.stat.exists
    fail_msg: >-
      {{ inventory_hostname }} is not a fresh master target. Existing K3s server
      or agent state was found. Use the guarded worker-promotion workflow instead
      of overwriting this node.
  tags: [additional_master, install]

- name: Set the expected Kubernetes node name
  ansible.builtin.set_fact:
    k3s_expected_node_name: "{{ k3s_node_name_override | default(ansible_hostname, true) }}"
  tags: [additional_master, verify]

- name: Verify primary master is accessible
  wait_for:
    host: "{{ k3s_master_ip }}"
    port: "{{ k3s_api_port }}"
    timeout: 30
  tags: [additional_master, verify]

- name: Install K3s server on additional master node
  shell: "{{ k3s_additional_master_install_cmd }}"
  register: k3s_server_install
  no_log: true
  when: not k3s_server_service.stat.exists
  tags: [additional_master, install]

- name: Wait for K3s to be ready
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 120
  when: k3s_server_install is changed
  tags: [additional_master, install]

- name: Enable and start K3s service
  systemd:
    name: k3s
    enabled: yes
    state: started
  tags: [additional_master, service]

- name: Wait for K3s API server to be ready on this node
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ k3s_api_port }}"
    timeout: 120
  tags: [additional_master, service]

- name: Create .kube directory for pi user
  file:
    path: /home/pi/.kube
    state: directory
    owner: pi
    group: pi
    mode: '0755'
  tags: [additional_master, config]

- name: Copy kubeconfig to pi user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/pi/.kube/config
    remote_src: yes
    owner: pi
    group: pi
    mode: '0600'
  tags: [additional_master, config]

- name: Update kubeconfig server address
  lineinfile:
    path: /home/pi/.kube/config
    regexp: '^\s+server:\s+https://.*:6443'
    line: "    server: https://{{ k3s_master_ip }}:{{ k3s_api_port }}"
    backrefs: yes
  tags: [additional_master, config]

- name: Set KUBECONFIG environment variable
  lineinfile:
    path: /home/pi/.bashrc
    line: 'export KUBECONFIG=/home/pi/.kube/config'
    state: present
  tags: [additional_master, config]

- name: Install kubectl completion
  lineinfile:
    path: /home/pi/.bashrc
    line: 'source <(kubectl completion bash)'
    state: present
  when: install_kubectl_completion
  tags: [additional_master, config]

- name: Add kubectl alias
  lineinfile:
    path: /home/pi/.bashrc
    line: 'alias k=kubectl'
    state: present
  tags: [additional_master, config]

- name: Check K3s service status
  systemd:
    name: k3s
  register: k3s_service_status
  tags: [additional_master, verify]

- name: Get K3s service logs if not running
  command: journalctl -u k3s -n 50 --no-pager
  register: k3s_logs
  when: k3s_service_status.status.ActiveState != "active"
  tags: [additional_master, verify]

- name: Display K3s logs if service failed
  debug:
    msg: "{{ k3s_logs.stdout_lines }}"
  when: k3s_service_status.status.ActiveState != "active"
  tags: [additional_master, verify]

- name: Fail if K3s service is not running
  fail:
    msg: |
      K3s service is not running on {{ inventory_hostname }}!
      Status: {{ k3s_service_status.status.ActiveState }}
      SubState: {{ k3s_service_status.status.SubState }}

      Check the logs above for errors.
  when: k3s_service_status.status.ActiveState != "active"
  tags: [additional_master, verify]

- name: Wait for node to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - node
      - "{{ k3s_expected_node_name }}"
      - --no-headers
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: node_ready
  until:
    - node_ready.rc == 0
    - "' Ready' in node_ready.stdout"
  retries: 30
  delay: 10
  changed_when: false
  tags: [additional_master, verify]

- name: Get node info
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - node
      - "{{ k3s_expected_node_name }}"
      - -o
      - wide
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: node_info
  changed_when: false
  tags: [additional_master, verify]

- name: Show node info
  debug:
    var: node_info.stdout_lines
  tags: [additional_master, verify]
