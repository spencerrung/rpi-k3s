[defaults]
host_key_checking = False
stdout_callback = ansible.builtin.default
gathering = smart
retry_files_enabled = False
timeout = 30

[ansible.builtin.default]
result_format = yaml

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
